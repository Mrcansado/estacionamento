<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro - Estacionamento</title>

    <style>
        :root{
            --forest:#0e4d45; --forest-dark:#082f2a; --forest-soft:#e4f1ec;
            --amber:#f2a516; --amber-dark:#d98f08;
            --cream:#f7f3ea; --paper:#fffdf8; --line:#e6dfce;
            --ink:#14231f; --muted:#667872;
            --ok-bg:#e6f4ea; --ok:#1e6b3a; --bad-bg:#fdebe7; --bad:#a3361f;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;line-height:1.5}
        h1,h2,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.01em}
        a{color:var(--forest)}

        /* ---------- Auth (split screen) ---------- */
        .auth{display:grid;grid-template-columns:minmax(300px,5fr) 6fr;min-height:100vh}
        .brand{position:relative;overflow:hidden;background:var(--forest);color:#fff;padding:48px 44px;display:flex;flex-direction:column;justify-content:space-between}
        .brand::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 78px,rgba(255,255,255,.07) 78px 82px);pointer-events:none}
        .brand::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(0deg,var(--forest-dark),transparent);pointer-events:none}
        .brand>*{position:relative;z-index:1}
        .logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;letter-spacing:.02em}
        .logo-mark{width:42px;height:42px;border-radius:12px;background:var(--amber);color:var(--forest-dark);display:grid;place-items:center;font-family:Georgia,serif;font-size:24px;font-weight:700}
        .brand h2{font-size:38px;line-height:1.1;margin-bottom:14px;max-width:11em}
        .brand p{color:#bfe0d6;max-width:24em}
        .plate{display:inline-block;margin-top:26px;padding:6px 14px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-top:10px solid #1d4fb8;border-radius:8px;font-family:"Courier New",monospace;font-weight:700;font-size:20px;letter-spacing:.12em}
        .auth-main{display:flex;align-items:center;justify-content:center;padding:40px 24px}
        .auth-box{width:100%;max-width:440px}
        .auth-box h1,.auth-box h2{font-size:32px;color:var(--forest-dark);margin-bottom:6px}
        .subtitle{color:var(--muted);margin-bottom:24px}

        /* ---------- Forms ---------- */
        label{display:block;font-weight:600;font-size:13px;letter-spacing:.03em;text-transform:uppercase;margin:16px 0 6px;color:var(--forest)}
        input,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:var(--paper);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
        input:focus,select:focus{border-color:var(--forest);box-shadow:0 0 0 4px rgba(14,77,69,.14)}
        button,.btn{display:block;width:100%;border:none;border-radius:10px;padding:14px 18px;margin-top:22px;background:var(--amber);color:var(--forest-dark);font-weight:800;font-size:15px;font-family:inherit;cursor:pointer;text-align:center;text-decoration:none;transition:background .15s,transform .05s}
        button:hover,.btn:hover{background:var(--amber-dark)}
        button:active,.btn:active{transform:translateY(1px)}
        .link{text-align:center;margin-top:20px;color:var(--muted);font-size:14px}
        .link a{color:var(--forest);font-weight:700;text-decoration:none;border-bottom:2px solid var(--amber)}
        .success{border-left:5px solid var(--ok);background:var(--ok-bg);padding:14px 16px;border-radius:8px;color:var(--ok);margin:20px 0}
        .error{border-left:5px solid var(--bad);background:var(--bad-bg);padding:14px 16px;border-radius:8px;color:var(--bad);margin:20px 0}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .small{font-size:12px;color:var(--muted);margin-top:6px}

        /* ---------- App shell ---------- */
        .nav{background:var(--forest);color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--amber)}
        .nav .logo-mark{width:34px;height:34px;font-size:19px;border-radius:9px}
        .nav a{color:#d6ece5;text-decoration:none;margin-left:6px;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px}
        .nav a:hover{background:rgba(255,255,255,.12);color:#fff}
        .nav a.active{background:#fff;color:var(--forest-dark)}
        .panel{max-width:1040px;margin:34px auto;padding:0 20px}
        .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
        .page-head h1{font-size:34px;color:var(--forest-dark)}
        .page-head .subtitle{margin:0}
        .pill{display:inline-block;background:var(--forest-soft);color:var(--forest);font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px}
        .actions{display:flex;gap:10px;flex-wrap:wrap}
        .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 2px 0 var(--line)}
        .actions .btn,.card>.btn{display:inline-block;width:auto;margin-top:0}
        .btn-outline{background:transparent;color:var(--forest);box-shadow:inset 0 0 0 2px var(--forest)}
        .btn-outline:hover{background:var(--forest);color:#fff}
        table{width:100%;border-collapse:collapse;margin-top:6px}
        th,td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
        th{color:var(--forest);font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--forest-soft)}
        th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
        tbody tr:hover{background:#faf6ea}
        td.placa{font-family:"Courier New",monospace;font-weight:700;letter-spacing:.1em}
        td.placa span{display:inline-block;background:#fff;border:2px solid var(--ink);border-top:6px solid #1d4fb8;border-radius:6px;padding:1px 9px}
        td .btn{display:inline-block;width:auto;margin:0;padding:9px 14px;font-size:13px}
        .empty{color:var(--muted);padding:30px 0;text-align:center;border:2px dashed var(--line);border-radius:12px;margin:10px 0 4px}
        .back{margin-top:22px}
        .back .btn{display:inline-block;width:auto}

        @media(max-width:860px){
            .auth{grid-template-columns:1fr}
            .brand{padding:28px 24px}
            .brand h2{font-size:28px}
            .brand p,.plate{display:none}
        }
        @media(max-width:560px){
            .row{grid-template-columns:1fr}
            .nav{padding:12px 16px}
            .page-head h1{font-size:28px}
            .card{padding:18px}
            table,thead,tbody,tr,th,td{display:block}
            thead{display:none}
            tr{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
            td{border:0;padding:6px 0}
        }
    </style>
</head>
<body>
<div class="auth">
    <aside class="brand">
        <div class="logo"><span class="logo-mark">P</span> Estacionamento</div>
        <div>
            <h2>Cada vaga, sob controle.</h2>
            <p>Registre entradas e saídas de veículos de forma rápida e organizada.</p>
            <span class="plate">ABC1D23</span>
        </div>
    </aside>
    <main class="auth-main">
        <div class="auth-box">
            <h1>Ocorreu um erro</h1>
            <div class="error">Usuário ou senha inválidos.</div>
            <a class="btn" href="/">Tentar novamente</a>
            <p class="link">Ainda não possui cadastro? <a href="/cadastro">Criar conta</a></p>
        </div>
    </main>
</div>
</body>
</html>
