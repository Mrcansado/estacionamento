<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro - Estacionamento</title>

    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a8a);min-height:100vh;color:#111827}
        .container{width:100%;max-width:460px;margin:50px auto;padding:20px}
        .card{background:#fff;border-radius:18px;padding:32px;box-shadow:0 18px 45px rgba(0,0,0,.25)}
        h1,h2{text-align:center;color:#0f172a;margin-bottom:10px}
        .subtitle{text-align:center;color:#64748b;margin-bottom:24px}
        label{display:block;font-weight:600;font-size:14px;margin:13px 0 7px;color:#334155}
        input,select{width:100%;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;outline:none}
        input:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
        button,.btn{display:block;width:100%;border:none;border-radius:10px;padding:13px 16px;margin-top:20px;background:#2563eb;color:#fff;font-weight:700;font-size:15px;cursor:pointer;text-align:center;text-decoration:none}
        button:hover,.btn:hover{background:#1d4ed8}
        .link{text-align:center;margin-top:18px;color:#64748b;font-size:14px}
        .link a{color:#2563eb;text-decoration:none;font-weight:600}
        .success{border-left:5px solid #16a34a;background:#f0fdf4;padding:14px;border-radius:8px;color:#166534;margin:20px 0}
        .error{border-left:5px solid #dc2626;background:#fef2f2;padding:14px;border-radius:8px;color:#991b1b;margin:20px 0}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .small{font-size:12px;color:#64748b;margin-top:6px}
        @media(max-width:520px){.container{margin:20px auto}.card{padding:24px}.row{grid-template-columns:1fr}}
        .nav{background:#0f172a;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
        .nav strong{font-size:18px}
        .nav a{color:#fff;text-decoration:none;margin-left:16px}
        .panel{max-width:1000px;margin:30px auto;padding:0 20px}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-top:24px}
        .tile{background:#fff;border-radius:16px;padding:24px;box-shadow:0 10px 25px rgba(0,0,0,.12)}
        .tile h3{margin-bottom:8px}.tile p{color:#64748b;font-size:14px;line-height:1.5}
    </style>

</head>
<body>
<div class="container">
    <div class="card">
        <h1>Ocorreu um erro</h1>
        <div class="error">Usuário ou senha inválidos.</div>
        <a class="btn" href="/">Tentar novamente</a>
        <p class="link">Ainda não possui cadastro? <a href="/cadastro">Criar conta</a></p>
    </div>
</div>
</body>
</html>
