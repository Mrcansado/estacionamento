<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Estacionamento</title>

    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a8a);min-height:100vh;color:#111827}
        .nav{background:#0f172a;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
        .nav strong{font-size:18px}
        .nav a{color:#fff;text-decoration:none;margin-left:16px}
        .panel{max-width:1000px;margin:30px auto;padding:0 20px}
        .card{background:#fff;border-radius:18px;padding:32px;box-shadow:0 18px 45px rgba(0,0,0,.25)}
        h1,h2{color:#0f172a;margin-bottom:10px}
        .subtitle{color:#64748b;margin-bottom:24px}
        .btn{display:inline-block;border:none;border-radius:10px;padding:12px 18px;margin-top:10px;background:#2563eb;color:#fff;font-weight:700;font-size:15px;cursor:pointer;text-align:center;text-decoration:none}
        .btn:hover{background:#1d4ed8}
        table{width:100%;border-collapse:collapse;margin-top:20px}
        th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #e2e8f0;font-size:14px}
        th{color:#334155;font-weight:700}
        td{color:#111827}
        .empty{color:#64748b;padding:20px 0}
    </style>
</head>
<body>
<div class="nav">
    <strong>Estacionamento</strong>
    <div><a href="/painel">Painel</a><a href="/">Sair</a></div>
</div>

<div class="panel">
    <div class="card">
        <h1>Painel</h1>
        <p class="subtitle">Veículos atualmente estacionados</p>

        <a class="btn" href="/veiculo/cadastrar-veiculo">+ Registrar entrada de veículo</a>
        <a class="btn" href="/veiculo/registrar-saida">Registrar saída</a>

        <table th:if="${veiculos != null and !veiculos.isEmpty()}">
            <thead>
            <tr>
                <th>Placa</th>
                <th>Modelo</th>
                <th>Cor</th>
                <th>Observações</th>
                <th>Entrada</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${veiculos}">
                <td th:text="${v.placa}"></td>
                <td th:text="${v.modelo}"></td>
                <td th:text="${v.cor}"></td>
                <td th:text="${v.observacoes}"></td>
                <td th:text="${#temporals.format(v.horaentrada, 'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <form method="post" th:action="@{/veiculo/saida/{id}(id=${v.id})}">
                        <button type="submit" class="btn">Registrar saída</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <p class="empty" th:if="${veiculos == null or veiculos.isEmpty()}">Nenhum veículo estacionado no momento.</p>
    </div>
</div>
</body>
</html>
